name: Verify decompilation
on:
  push:
    branches: [main, 'decompile/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-and-reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - name: Validate exporter contracts
        run: npm test
      - name: Fetch and authenticate the original shareware
        run: python tools/fetch_original.py
      - name: Build the portable recovered C library
        run: make all
      - name: Verify evidence and execute original x86 comparisons
        run: python -m pytest tests -q
      - name: Check reconstructed C for undefined behavior
        env:
          LEZAC_CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: python -m pytest tests/test_recovered.py -q
      - name: Reject whitespace errors
        run: git diff --check
