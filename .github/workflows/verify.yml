name: Verify decompilation
on:
  push:
    branches: [main, 'decompile/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-and-reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install the Pascal compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fp-compiler fp-units-rtl
      - name: Install hash-pinned i8086 DOS cross compiler
        run: |
          curl --fail --location --retry 3 --max-time 300 \
            --output "$RUNNER_TEMP/fpc8086.tar.xz" \
            https://downloads.freepascal.org/fpc/dist/3.2.2/x86_64-linux/fpc-3.2.2.x86_64-linux.cross.i8086-msdos.tar.xz
          printf '%s  %s\n' fda88f39548993df9b7345110a6b90e7bd64018e42c1ab51723fa16705b7f671 "$RUNNER_TEMP/fpc8086.tar.xz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/fpc8086"
          tar --extract --xz --no-same-owner --file "$RUNNER_TEMP/fpc8086.tar.xz" \
            --directory "$RUNNER_TEMP/fpc8086" \
            ./lib/fpc/3.2.2/ppcross8086 ./lib/fpc/3.2.2/units/msdos/8086-compact \
            ./lib/fpc/3.2.2/units/msdos/8086-large/rtl ./lib/fpc/3.2.2/units/msdos/8086-large/rtl-console
          printf 'FPC_DOS=%s\nFPC_DOS_RTL=%s\nFPC_DOS_LARGE=%s\n' \
            "$RUNNER_TEMP/fpc8086/lib/fpc/3.2.2/ppcross8086" \
            "$RUNNER_TEMP/fpc8086/lib/fpc/3.2.2/units/msdos/8086-compact/rtl" \
            "$RUNNER_TEMP/fpc8086/lib/fpc/3.2.2/units/msdos/8086-large" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - name: Validate exporter contracts
        run: npm test
      - name: Fetch and authenticate the original shareware
        run: python tools/fetch_original.py
      - name: Build the portable recovered C library
        run: make all
      - name: Build and execute reconstructed Pascal probes
        run: make pascal-native pascal-dos
      - name: Build the reconstructed game from source
        run: make game
      - name: Verify evidence and execute original x86 comparisons
        run: python -m pytest tests -q
      - name: Check reconstructed C for undefined behavior
        env:
          LEZAC_CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: python -m pytest tests/test_recovered.py -q
      - name: Reject whitespace errors
        run: git diff --check
  gameplay-lockstep:
    # Real gameplay comparison: the source-built game and the authenticated
    # original run the same input traces in lockstep (tests/test_lockstep.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install hash-pinned i8086 DOS cross compiler
        run: |
          curl --fail --location --retry 3 --max-time 300 \
            --output "$RUNNER_TEMP/fpc8086.tar.xz" \
            https://downloads.freepascal.org/fpc/dist/3.2.2/x86_64-linux/fpc-3.2.2.x86_64-linux.cross.i8086-msdos.tar.xz
          printf '%s  %s\n' fda88f39548993df9b7345110a6b90e7bd64018e42c1ab51723fa16705b7f671 "$RUNNER_TEMP/fpc8086.tar.xz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/fpc8086"
          tar --extract --xz --no-same-owner --file "$RUNNER_TEMP/fpc8086.tar.xz" \
            --directory "$RUNNER_TEMP/fpc8086" \
            ./lib/fpc/3.2.2/ppcross8086 \
            ./lib/fpc/3.2.2/units/msdos/8086-large/rtl ./lib/fpc/3.2.2/units/msdos/8086-large/rtl-console
          printf 'FPC_DOS=%s\nFPC_DOS_LARGE=%s\n' \
            "$RUNNER_TEMP/fpc8086/lib/fpc/3.2.2/ppcross8086" \
            "$RUNNER_TEMP/fpc8086/lib/fpc/3.2.2/units/msdos/8086-large" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch and authenticate the original shareware
        run: python tools/fetch_original.py
      - name: Build the reconstructed game from source
        run: make game
      - name: Original and rebuild in lockstep over the gameplay traces
        env:
          LEZAC_GAMEPLAY_TESTS: '1'
        run: python -m pytest tests/test_lockstep.py tests/test_game_build.py -v
      - name: Upload lockstep reports (hashes and state values only, no images)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lockstep-reports
          path: build/lockstep/*.json
          if-no-files-found: ignore
