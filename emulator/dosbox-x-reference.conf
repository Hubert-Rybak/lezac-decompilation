# Pinned DOSBox-X 2024.03.01 configuration for the ORIGINAL Larax & Zaco reference.
# tools/run_original.py substitutes the @...@ placeholders for one disposable run
# directory and refuses to mount analysis/original inputs. Settings not listed here
# use the built-in defaults of the pinned emulator build (analysis/emulator.json).
# Rationale for every choice is in docs/emulator-baseline.md.

[sdl]
output            = surface
showmenu          = false
autolock          = false
waitonerror       = false
priority          = normal,normal
mapperfile        = @MAPPER_FILE@

[log]
logfile           = @LOG_FILE@

[dosbox]
machine                  = vgaonly
memsize                  = 4
captures                 = @CAPTURE_DIR@
startbanner              = false
fastbioslogo             = true
disable graphical splash = true
quit warning             = false
saveremark               = false
show recorded filename   = false
synchronize time         = false

[render]
frameskip         = 0
aspect            = false
scaler            = normal2x

[cpu]
core              = normal
cputype           = 486
cycles            = fixed 26800

[mixer]
nosound           = false
rate              = 48000

[speaker]
pcspeaker         = true
tandy             = off
disney            = false

[sblaster]
sbtype            = none
oplmode           = none

[gus]
gus               = false

[midi]
mpu401            = none
mididevice        = none

[joystick]
joysticktype      = none

[dos]
keyboardlayout    = us

[autoexec]
@echo off
mount c "@GAME_DIR@"
c:
date 04-23-1996
time 12:00:00
LEZAC.EXE
exit
